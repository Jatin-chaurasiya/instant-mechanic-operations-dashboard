name: Build and Deploy Docker Image

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: jatin8953/instant-mechanic-backend:latest

  deploy:
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.5
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          envs: JWT_SECRET,RAZORPAY_KEY_ID,RAZORPAY_KEY_SECRET
          script: |
            cd ~/instant-mechanic

            touch .env

            sed -i '/^JWT_SECRET=/d' .env
            sed -i '/^RAZORPAY_KEY_ID=/d' .env
            sed -i '/^RAZORPAY_KEY_SECRET=/d' .env

            echo "JWT_SECRET=${JWT_SECRET}" >> .env
            echo "RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}" >> .env
            echo "RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}" >> .env

            sudo docker compose pull backend
            sudo docker compose up -d backend
            sudo docker image prune -f
